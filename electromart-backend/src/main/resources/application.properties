# ---- Server ----
server.port=8080

# ---- Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/electromart_db
spring.datasource.username=root
spring.datasource.password=Harsha@21279
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# validate = Hibernate checks entities against your existing schema and fails
# loudly on mismatch, instead of silently altering tables. Keeps the database
# (which you designed by hand) as the single source of truth.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
electromart.jwt.secret=electromart-secret-key-change-this-in-production-min-256-bits
electromart.jwt.expiration-ms=86400000

# ---- CORS (React dev server) ----
electromart.cors.allowed-origins=http://localhost:5173,http://localhost:3000