spring.datasource.url=jdbc:h2:mem:electromart_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop here (not validate) \u2014 for isolated test runs, H2 building the
# schema straight from the entities is fine; we're testing business logic,
# not re-verifying the hand-written MySQL DDL a second time.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

electromart.jwt.secret=test-secret-key-for-junit-only-not-for-production-use
electromart.jwt.expiration-ms=3600000
electromart.cors.allowed-origins=http://localhost:3000